baseURL = 'https://mizuka-wu.github.io/'
languageCode = 'zh-cn'
title = '水华的博客'
theme = 'PaperMod'

[author]
  name = '水华'
  headline = '前端开发者 & 技术博主'
  aboutme = '专注于 Web 开发和技术分享'

[params]
  # 首页信息
  homeInfoParams = {title = "欢迎光临水华的博客"}
  
  # 文章设置
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  
  # 作者信息
  [params.social]
    github = 'https://github.com/mizuka-wu'
    
[menu]
  [[menu.main]]
    identifier = 'categories'
    name = '分类'
    url = '/categories/'
    weight = 10

  [[menu.main]]
    identifier = 'tags'
    name = '标签'
    url = '/tags/'
    weight = 20

  [[menu.main]]
    identifier = 'archive'
    name = '归档'
    url = '/archive/'
    weight = 30

  [[menu.main]]
    identifier = 'github'
    name = 'GitHub'
    url = 'https://github.com/mizuka-wu'
    weight = 40

[imaging]
  resampleFilter = 'lanczos'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
