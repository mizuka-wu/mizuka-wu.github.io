baseURL = 'https://mizuka-wu.github.io/'
languageCode = 'zh-cn'
title = '水华的博客'
theme = 'PaperMod_new'

[params]
  defaultTheme = 'light'
  displayFullTextMode = true
  highlightCode = true
  homeInfoParams.title = "欢迎光临水华的博客"
  ShowCodeCopyButtons = true
  ShowPostNavLinks = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  ShowBreadCrumbs = true
  ShowShareButtons = true
  
  [params.social]
    github = 'https://github.com/mizuka-wu'
  
  [params.author]
    name = '水华'
    headline = '前端开发者 & 技术博主'
    aboutme = '专注于 Web 开发和技术分享'

[menu]
  [[menu.main]]
    identifier = 'categories'
    name = '分类'
    url = '/categories/'
    weight = 10

  [[menu.main]]
    identifier = 'tags'
    name = '标签'
    url = '/tags/'
    weight = 20

  [[menu.main]]
    identifier = 'archive'
    name = '归档'
    url = '/archive/'
    weight = 30

  [[menu.main]]
    identifier = 'github'
    name = 'GitHub'
    url = 'https://github.com/mizuka-wu'
    weight = 40

[imaging]
  resampleFilter = 'lanczos'
  quality = 100

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
